<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labyrinth Box - Entity Studio</title>
<style>
  :root {
    --bg0: #161616; --bg1: #1f1f1f; --bg2: #282828; --bg3: #353535; --bg4: #444; --edge: #0b0b0b;
    --ink: #e4e4e4; --dim: #9a9a9a; --acc: #4772b3; --acc2: #5b8ad0; --gold: #e9c46a;
    --good: #7fd18a; --bad: #e2705e; --warn: #e8a23a; --in: #1a1a1a;
    --ui: system-ui, "Segoe UI", Roboto, sans-serif; --mono: ui-monospace, Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg0); color: var(--ink); font: 12px/1.45 var(--ui); overflow: hidden; user-select: none; }
  input, select, textarea, button { font: inherit; color: inherit; }
  #app { display: grid; grid-template-rows: 30px 38px minmax(0, 1fr) 40px 24px; height: 100vh; }

  /* ---------------------------------------------------------------- menu bar */
  #menubar { display: flex; align-items: stretch; background: var(--bg1); border-bottom: 1px solid var(--edge); padding: 0 6px; gap: 2px; position: relative; z-index: 30; }
  #menubar .brand { display: flex; align-items: center; gap: 7px; padding: 0 10px 0 4px; font-weight: 600; letter-spacing: .08em; color: var(--gold); white-space: nowrap; }
  #menubar .brand i { width: 14px; height: 14px; border-radius: 3px; background: linear-gradient(135deg, var(--gold), #b5832a); display: inline-block; }
  .mbtn { background: none; border: 0; padding: 0 10px; border-radius: 4px; cursor: pointer; }
  .mbtn:hover, .mbtn.open { background: var(--bg4); }
  .spacer { flex: 1; }
  #menubar .chip { align-self: center; margin-right: 6px; padding: 2px 9px; border-radius: 99px; background: var(--bg3); color: var(--dim); cursor: pointer; font-size: 11px; }
  #menubar .chip.bad { background: #5a2a22; color: #ffb7a8; }
  #menubar .chip.good { background: #25422b; color: #a8e6b0; }
  .primary { background: var(--acc); border: 0; border-radius: 4px; padding: 0 14px; align-self: center; height: 22px; cursor: pointer; font-weight: 600; }
  .primary:hover { background: var(--acc2); }
  .dd { position: absolute; top: 30px; min-width: 230px; background: var(--bg2); border: 1px solid var(--edge); border-radius: 6px; padding: 4px; box-shadow: 0 10px 28px rgba(0,0,0,.55); z-index: 50; }
  .dd .it { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .dd .it:hover { background: var(--acc); }
  .dd .it .k { margin-left: auto; color: var(--dim); font-size: 11px; padding-left: 20px; }
  .dd .it:hover .k { color: #dfe8f7; }
  .dd .it .ck { width: 12px; text-align: center; color: var(--gold); }
  .dd .sep { height: 1px; background: var(--bg4); margin: 4px 2px; }

  /* ---------------------------------------------------------------- option bar */
  #optbar { display: flex; align-items: center; gap: 12px; padding: 0 10px; background: var(--bg2); border-bottom: 1px solid var(--edge); overflow: hidden; white-space: nowrap; }
  #optbar .tname { font-weight: 600; color: var(--gold); min-width: 74px; }
  #optbar .hintline { color: var(--dim); overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; }
  #optbar .opts { flex: none; }
  #optbar .opts { display: flex; align-items: center; gap: 10px; }
  #optbar .opts .fld { width: 150px; }
  #optbar .opts .fld.sel { width: 176px; }
  #optbar .swatchwrap { display: flex; align-items: center; gap: 6px; }

  /* ---------------------------------------------------------------- work area */
  #work { display: grid; grid-template-columns: 44px 224px minmax(280px, 1fr) 356px; min-height: 0; }
  @media (max-width: 1180px) { #work { grid-template-columns: 44px minmax(260px, 1fr) 330px; } #left { display: none; } }
  @media (max-width: 820px) { body { overflow: auto; } #app { height: auto; grid-template-rows: 30px 38px auto 40px 24px; } #work { grid-template-columns: 44px 1fr; grid-template-rows: 60vh auto; } #props { grid-column: 1 / -1; max-height: none; } }

  #toolbox { background: var(--bg1); border-right: 1px solid var(--edge); display: flex; flex-direction: column; align-items: center; padding: 6px 0; gap: 3px; }
  .tool { width: 34px; height: 34px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; display: grid; place-items: center; position: relative; color: #c8c8c8; }
  .tool:hover { background: var(--bg3); }
  .tool.on { background: var(--acc); color: #fff; }
  .tool svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tool .kbd { position: absolute; right: 2px; bottom: 0; font-size: 8px; color: var(--dim); }
  .tool.on .kbd { color: #dce7fa; }
  #toolbox hr { width: 26px; border: 0; border-top: 1px solid var(--bg4); margin: 4px 0; }

  #left { background: var(--bg1); border-right: 1px solid var(--edge); overflow: auto; min-height: 0; }
  .panelhead { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--bg2); border-bottom: 1px solid var(--edge); font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #cfcfcf; cursor: pointer; }
  .panelhead::before { content: "\25BE"; color: var(--dim); font-size: 10px; }
  .panelhead.shut::before { content: "\25B8"; }
  .panelbody { padding: 4px 0 8px; }
  .panelbody.shut { display: none; }
  .row-o { display: flex; align-items: center; gap: 6px; padding: 2px 8px; cursor: pointer; min-height: 22px; border-radius: 3px; margin: 0 4px; }
  .row-o:hover { background: var(--bg3); }
  .row-o.sel { background: #3a4d6b; }
  .row-o.dim { opacity: .45; }
  .row-o .ico { width: 14px; height: 14px; border-radius: 3px; flex: none; }
  .row-o .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-o .eye { width: 16px; text-align: center; color: var(--dim); font-size: 11px; }
  .row-o .eye.off { opacity: .35; }
  .row-o .cnt { color: var(--dim); font-size: 10px; }
  #presets { display: grid; grid-template-columns: 1fr; gap: 3px; padding: 4px 8px 6px; }
  #presets button { text-align: left; background: var(--bg3); border: 0; border-radius: 4px; padding: 5px 9px; cursor: pointer; }
  #presets button:hover { background: var(--acc); }

  /* ---------------------------------------------------------------- viewport */
  #viewwrap { position: relative; min-width: 0; min-height: 0; background: #111; overflow: hidden; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; cursor: grab; }
  #c.paint { cursor: crosshair; }
  #c.pick { cursor: copy; }
  #c.grabbing { cursor: grabbing; }
  #vhead { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
  #vhead > * { pointer-events: auto; }
  .vgroup { display: flex; background: rgba(30,30,30,.82); border: 1px solid rgba(0,0,0,.6); border-radius: 6px; overflow: hidden; backdrop-filter: blur(4px); }
  .vgroup button, .vgroup select { background: none; border: 0; padding: 4px 9px; cursor: pointer; border-right: 1px solid rgba(255,255,255,.06); }
  .vgroup button:last-child { border-right: 0; }
  .vgroup button:hover { background: rgba(255,255,255,.12); }
  .vgroup button.on { background: var(--acc); color: #fff; }
  .vgroup select { background: transparent; padding: 3px 4px; width: auto; min-width: 118px; }
  .vgroup select option { background: #2b2b2b; }
  #gizmo { position: absolute; right: 10px; top: 52px; width: 96px; height: 96px; cursor: pointer; }
  #vfoot { position: absolute; left: 10px; right: 10px; bottom: 8px; display: flex; justify-content: space-between; gap: 12px; color: rgba(255,255,255,.62); font-size: 11px; pointer-events: none; text-shadow: 0 1px 3px #000; }
  #vtoast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); background: rgba(20,20,20,.9); border: 1px solid var(--bg4); padding: 5px 14px; border-radius: 99px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #vtoast.on { opacity: 1; }
  #novgl { position: absolute; inset: 0; display: none; place-items: center; text-align: center; color: var(--bad); padding: 30px; }

  /* ---------------------------------------------------------------- properties */
  #props { background: var(--bg1); border-left: 1px solid var(--edge); display: grid; grid-template-columns: 34px minmax(0, 1fr); min-height: 0; }
  #tabs { background: var(--bg0); display: flex; flex-direction: column; padding-top: 6px; gap: 2px; }
  .tab { height: 34px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: #aaa; border-left: 3px solid transparent; }
  .tab:hover { background: var(--bg2); color: #fff; }
  .tab.on { background: var(--bg1); color: #fff; border-left-color: var(--acc2); }
  .tab svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #tabbody { overflow: auto; min-height: 0; }
  .tabpane { display: none; padding-bottom: 20px; }
  .tabpane.on { display: block; }
  .tabtitle { padding: 8px 12px 4px; font-size: 14px; font-weight: 600; }
  .tabsub { padding: 0 12px 6px; color: var(--dim); }
  .grp { margin: 0 6px 6px; background: var(--bg2); border-radius: 6px; border: 1px solid var(--edge); }
  .grp-h { padding: 5px 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .grp-h::before { content: "\25BE"; color: var(--dim); font-size: 10px; }
  .grp-h.shut::before { content: "\25B8"; }
  .grp-b { padding: 2px 8px 8px; }
  .grp-b.shut { display: none; }
  .fld { position: relative; display: grid; grid-template-columns: 112px minmax(0, 1fr); align-items: center; gap: 8px; min-height: 24px; margin-top: 3px; }
  .fld > .lab { color: #bdbdbd; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fld.wide { grid-template-columns: 1fr; }
  .fld.wide > .lab { text-align: left; }
  .fld.slider { display: block; height: 22px; background: var(--bg4); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .fld.slider .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--acc); width: 50%; pointer-events: none; }
  .fld.slider .lab, .fld.slider .val { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; padding: 0 9px; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .fld.slider .lab { left: 0; text-align: left; color: #f0f0f0; }
  .fld.slider .val { right: 0; font-family: var(--mono); font-size: 11px; }
  .fld.slider input[type=range] { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
  .fld.slider:hover { background: #505050; }
  .fld.slider .edit { position: absolute; inset: 0; width: 100%; border: 1px solid var(--acc2); border-radius: 4px; background: var(--in); text-align: center; font-family: var(--mono); }
  input[type=text], input[type=number], select, textarea { width: 100%; background: var(--in); border: 1px solid var(--bg4); border-radius: 4px; padding: 3px 7px; min-height: 22px; user-select: text; }
  input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus { outline: 1px solid var(--acc2); border-color: var(--acc2); }
  textarea { min-height: 58px; resize: vertical; font-family: var(--ui); }
  select { padding: 2px 4px; }
  .colorf { display: flex; align-items: center; gap: 7px; }
  .colorf input[type=color] { width: 38px; height: 22px; padding: 0; border: 1px solid var(--edge); border-radius: 4px; background: none; cursor: pointer; flex: none; }
  .colorf code { font-family: var(--mono); color: var(--dim); font-size: 11px; }
  .chkf { display: flex; align-items: center; gap: 8px; min-height: 24px; margin-top: 3px; cursor: pointer; }
  .chkf input { accent-color: var(--acc2); margin: 0 0 0 4px; }
  .chkf small { color: var(--dim); }
  .flaggrid { display: grid; grid-template-columns: 1fr; gap: 0; }
  .btn { background: var(--bg4); border: 0; border-radius: 4px; padding: 4px 11px; cursor: pointer; min-height: 24px; }
  .btn:hover { background: #575757; }
  .btn.on { background: var(--acc); }
  .btn.pri { background: var(--acc); font-weight: 600; }
  .btn.pri:hover { background: var(--acc2); }
  .btn.dng:hover { background: #8a3a2f; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .note { color: var(--dim); margin: 5px 2px; }
  .note b { color: #cfcfcf; font-weight: 600; }
  .warn { color: var(--bad); } .ok { color: var(--good); }
  ul.plist { margin: 4px 0 0; padding-left: 18px; } ul.plist li { margin: 3px 0; }
  pre { background: #101010; border: 1px solid var(--edge); border-radius: 6px; padding: 8px; overflow: auto; max-height: 340px; font: 11px/1.45 var(--mono); user-select: text; margin: 6px 0 0; white-space: pre; }
  code { background: #101010; border: 1px solid var(--edge); border-radius: 4px; padding: 0 5px; font: 11px var(--mono); user-select: text; }
  ol.steps { margin: 4px 0 0; padding-left: 18px; } ol.steps li { margin: 6px 0; }
  .pal { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 6px; }
  .pal i { aspect-ratio: 1; border-radius: 4px; cursor: pointer; border: 1px solid rgba(0,0,0,.6); display: block; }
  .pal i:hover { outline: 2px solid #fff; }
  .strokes .srow { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 4px; }
  .strokes .srow:hover { background: var(--bg3); }
  .badge { font: 11px var(--mono); color: var(--gold); background: #101010; border-radius: 99px; padding: 1px 9px; }

  /* ---------------------------------------------------------------- timeline + status */
  #timeline { display: flex; align-items: center; gap: 10px; padding: 0 10px; background: var(--bg1); border-top: 1px solid var(--edge); overflow: hidden; white-space: nowrap; }
  #timeline .seg { display: flex; background: var(--bg3); border-radius: 5px; overflow: hidden; }
  #timeline .seg button { background: none; border: 0; padding: 4px 11px; cursor: pointer; }
  #timeline .seg button:hover { background: #4a4a4a; }
  #timeline .seg button.on { background: var(--acc); color: #fff; }
  #timeline .fld { width: 150px; }
  #statusbar { display: flex; align-items: center; gap: 14px; padding: 0 10px; background: var(--bg0); border-top: 1px solid var(--edge); color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; }
  #statusbar #tip { flex: 1; overflow: hidden; text-overflow: ellipsis; }

  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; place-items: center; z-index: 80; }
  #modal.on { display: grid; }
  #modal .card { width: min(560px, 92vw); max-height: 86vh; overflow: auto; background: var(--bg2); border: 1px solid var(--edge); border-radius: 10px; padding: 16px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.7); user-select: text; }
  #modal h3 { margin: 0 0 8px; font-size: 15px; }
  #modal table { border-collapse: collapse; width: 100%; } #modal td { padding: 3px 6px; border-bottom: 1px solid var(--bg3); } #modal td:first-child { font-family: var(--mono); color: var(--gold); white-space: nowrap; }
  ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 6px; border: 2px solid var(--bg1); } ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app">
  <div id="menubar">
    <div class="brand"><i></i>ENTITY STUDIO</div>
    <div id="menus"></div>
    <div class="spacer"></div>
    <span class="chip good" id="chip">checking&hellip;</span>
    <button type="button" class="primary" id="dl">Download .js</button>
  </div>

  <div id="optbar"></div>

  <div id="work">
    <div id="toolbox"></div>

    <div id="left">
      <div class="panelhead" data-fold="outliner">Outliner</div>
      <div class="panelbody" id="outliner"></div>
      <div class="panelhead" data-fold="presetbox">Start from a preset</div>
      <div class="panelbody" id="presetbox">
        <div id="presets"></div>
        <p class="note" style="padding:0 10px">A preset fills in the whole creature. Change anything after &mdash; the viewport and the file follow.</p>
      </div>
    </div>

    <div id="viewwrap">
      <canvas id="c" tabindex="0"></canvas>
      <div id="vhead">
        <div class="vgroup" id="vshade"></div>
        <div class="vgroup" id="vover"></div>
        <div class="vgroup" id="vcam"></div>
        <div class="vgroup" id="vlook"></div>
      </div>
      <canvas id="gizmo" width="192" height="192"></canvas>
      <div id="vfoot"><span id="vinfo">-</span><span id="readout">-</span></div>
      <div id="vtoast"></div>
      <div id="novgl"></div>
    </div>

    <div id="props">
      <div id="tabs"></div>
      <div id="tabbody"></div>
    </div>
  </div>

  <div id="timeline">
    <div class="seg" id="poseseg"></div>
    <input type="hidden" id="pose" value="walk">
    <div class="seg"><button type="button" id="playbtn" title="Play / pause the animation (Space)">&#10074;&#10074; Pause</button></div>
    <div id="speedwrap"></div>
    <span class="spacer"></span>
    <span class="badge" id="seedbadge">seed 1</span>
    <button type="button" class="btn" id="reseed" title="Same species, a different individual (R)">New random bits</button>
    <button type="button" class="btn" id="rebuild" title="Rebuild the model from the controls">Rebuild</button>
  </div>
  <div id="statusbar"><span id="tip">Ready.</span><span id="stpaint"></span><span id="sthist"></span></div>
</div>
<div id="modal"><div class="card" id="modalcard"></div></div>
<input type="file" id="openfile" accept=".js,text/javascript" style="display:none">

<script>window.__mod = {};</script>
<script src="../lib/three.js"></script>
<script src="../lib/BufferGeometryUtils.js"></script>
<script src="../lib/shaderpatch.js"></script>
<script src="../lib/rng.js"></script>
<script src="../entities/loader.js"></script>
<script>
// ============================================================================
// ENTITY STUDIO - writes one entities/<id>.js file (a model builder plus the
// creature's stats) out of the controls, and shows the result live in a
// Blender / Paint 3D style workspace:
//
//   menu bar + tool options    toolbox (orbit, brush, spray, eraser, picker, fill)
//   outliner + presets         viewport (gizmo, shading, overlays, brush cursor)
//   properties tabs            timeline (pose, play, seed)
//
// The generated file uses the same shared parts as every creature in the game
// (entities/core/rig.js and models-kit.js), so it walks, hunts or ignores you
// exactly like the built-in ones do. The file also carries the studio's own
// state in a trailing comment, so "File > Open .js" can pick up where you left off.

function flagList() { return FLAGS.map(([id]) => id).filter((id) => $('flag_' + id).checked); }
function tips() { return $('tips').value.split('\n').map((s) => s.trim()).filter(Boolean); }
function camel(id) { return id.replace(/(^|-|_)([a-z0-9])/g, (m, a, b) => b.toUpperCase()); }

function buildFile() {
  const kind = $('kind').value;
  const H = clampRange(num('height'), 0.6, 4);
  const build = clampRange(num('build'), -1, 1);
  const head = clampRange(num('head'), 0.6, 1.6);
  const limbs = clampRange(num('limbs'), 0.8, 1.25);
  const stride = clampRange(num('stride'), 0.8, 2.2);
  const eyes = clampRange(Math.round(num('eyes')), 0, 6);
  const horns = clampRange(Math.round(num('horns')), 0, 4);
  const clothes = $('clothes').checked;
  const claws = $('claws').checked;
  const glow = $('gloweyes').checked;
  // ---- fine anatomy ----------------------------------------------------
  const frame = FRAMES[$('frame').value] || FRAMES.normal;
  const shoulders = clampRange(num('shoulders'), 0.7, 1.5);
  const neckLen = clampRange(num('neck'), 0.5, 2);
  const hs = HEAD_SHAPES[$('headshape').value] || HEAD_SHAPES.normal;
  const es = EYE_SHAPES[$('eyeshape').value] || EYE_SHAPES.round;
  const eyeGap = clampRange(num('eyegap'), 0.4, 2.2);
  const eyeSize = clampRange(num('eyesize'), 0.6, 2);
  const eyeTilt = clampRange(num('eyetilt'), -0.6, 0.6) + es.tilt;
  const brow = clampRange(num('brow'), 0, 1);
  const jaw = JAWS[$('jaw').value] || JAWS.none;
  const teeth = TEETH[$('teeth').value] || TEETH.none;
  const toothSize = clampRange(num('toothsize'), 0.5, 1.8);
  const mouthW = clampRange(num('mouthw'), 0.6, 1.6);
  const id = ($('id').value.trim() || 'my-entity').replace(/[^a-z0-9_-]/gi, '-').toLowerCase();
  const name = $('name').value.trim() || id;
  const fname = ($('filename').value.trim().replace(/[^a-z0-9_.-]/gi, '-').replace(/\.js$/, '') || id) + '.js';
  const fn = 'build' + camel(id).replace(/^[a-z]/, (c) => c.toUpperCase());
  const quad = kind === 'quad';
  const k = quad ? H / 0.9 : H / 1.8;
  const w = (1 + build * 0.35) * frame.w, thick = (1 + build * 0.45) * frame.thick;

  // ---- skeleton numbers -------------------------------------------------
  const props = quad
    ? {
      hipH: 0.88 * k, thigh: 0.5 * k * limbs, shin: 0.46 * k * limbs, spine: 0.34 * k, chestH: 0.34 * k,
      neck: 0.2 * k * neckLen * frame.neck, shoulderW: 0.34 * w * frame.shoulder * shoulders, upperArm: 0.42 * k * limbs, foreArm: 0.4 * k * limbs,
      chestW: 0.3 * w, armR: 0.7 * thick, legR: 0.74 * thick, headR: 0.1 * head,
    }
    : {
      hipH: 0.95 * k, thigh: 0.45 * k * limbs, shin: 0.43 * k * limbs, spine: 0.2 * k, chestH: 0.32 * k,
      neck: 0.08 * neckLen * frame.neck, shoulderW: 0.4 * w * frame.shoulder * shoulders, upperArm: 0.3 * k * limbs, foreArm: 0.27 * k * limbs, chestW: 0.36 * w,
      armR: 0.9 * thick, legR: 0.9 * thick, headR: 0.112 * head,
    };
  const propText = Object.keys(props).map((key) => key + ': ' + small(props[key])).join(', ');

  const eyeY = quad ? H * 0.95 : H * 0.92;
  const bodyHeight = quad ? H * 1.2 : H;

  // ---- material blocks --------------------------------------------------
  const lines = [];
  lines.push('  const skinT = organic(' + str(id + '-skin') + ', { base: ' + str($('skinbase').value) +
    ', dark: ' + str($('skindark').value) + ', light: ' + str($('skinlight').value) + ', veins: ' + small(num('veins')) +
    ', pores: 0.4, mottle: ' + small(num('mottle')) + ' });');
  lines.push('  const skin = fleshMat(skinT, { rough: ' + small(clampRange(1 - num('rough'), 0.05, 1)) + ', bumpScale: 0.9 });');
  if (clothes) {
    lines.push('  const topT = cloth(' + str(id + '-clothing') + ', { base: ' + str($('top').value) + ', dark: ' + str('#202020') +
      ", stain: '#3a3026', weave: 110, stains: " + small(num('stains')) + ' });');
    lines.push("  const top = skinMat('#b0b0b0', { map: topT.map, bump: topT.bump, bumpScale: 0.8, rough: 0.85 });");
    lines.push('  const botT = cloth(' + str(id + '-trousers') + ', { base: ' + str($('bottom').value) + ", dark: '#101010', twill: '#5a6680', weave: 80, stains: " +
      small(num('stains')) + ', wear: ' + small(clampRange(num('stains') * 1.2, 0, 1)) + ' });');
  } else {
    lines.push('  const botT = cloth(' + str(id + '-hide') + ', { base: ' + str($('bottom').value) + ", dark: '#101010', weave: 80 });");
  }
  lines.push("  const bottom = skinMat('#a8a8a8', { map: botT.map, bump: botT.bump, bumpScale: 1.0, rough: 0.9 });");
  lines.push('  const shoes = skinMat(' + str($('shoes').value) + ', { rough: 0.4 });');
  if (claws) lines.push("  const clawM = skinMat('#1c1a18', { rough: 0.3 });");
  if (horns) lines.push('  const hornM = skinMat(' + str($('skinlight').value) + ', { rough: 0.35 });');

  // ---- 3D brush ---------------------------------------------------------
  // Hand-painted dabs, replayed on top of the generated skin so the paint is part
  // of the creature rather than part of the studio. Each mark is
  // [u, v, radius, colour, softness, strength] on one of the textures above.
  const paintByRole = { skin: [], top: [], bottom: [] };
  for (const st of painting) if (paintByRole[st.role]) for (const d of st.dabs) paintByRole[st.role].push(d);
  const paintedRoles = ['skin', 'top', 'bottom'].filter((r) => paintByRole[r].length && (r !== 'top' || clothes));
  if (paintedRoles.length) {
    const TEXVAR = { skin: 'skinT', top: 'topT', bottom: 'botT' };
    lines.push('  // ---- painted by hand with the 3D brush in other/entity-studio.html ----');
    lines.push('  const brush = (t, marks) => {');
    lines.push("    const c = t.canvas, g = c.getContext('2d');");
    lines.push('    for (const [u, v, r, col, soft, a] of marks) {');
    lines.push('      const m = /^#(..)(..)(..)$/.exec(col);');
    lines.push("      const rgb = m ? parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' + parseInt(m[3], 16) : '255,255,255';");
    lines.push('      const x = u * c.width, y = (1 - v) * c.height, rad = Math.max(1, r * c.width);');
    lines.push('      const gr = g.createRadialGradient(x, y, Math.max(0, rad * (1 - soft)), x, y, rad);');
    lines.push("      gr.addColorStop(0, 'rgba(' + rgb + ',' + a + ')');");
    lines.push("      gr.addColorStop(1, 'rgba(' + rgb + ',0)');");
    lines.push('      g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();');
    lines.push('    }');
    lines.push('    t.map.needsUpdate = true;');
    lines.push('  };');
    for (const role of paintedRoles) {
      const marks = paintByRole[role].map((d) => '[' + small(d[0]) + ', ' + small(d[1]) + ', ' + small(d[2]) + ', ' +
        str(d[3]) + ', ' + small(d[4]) + ', ' + small(d[5]) + ']');
      lines.push('  brush(' + TEXVAR[role] + ', [');
      for (let i = 0; i < marks.length; i += 4) lines.push('    ' + marks.slice(i, i + 4).join(', ') + (i + 4 < marks.length ? ',' : ''));
      lines.push('  ]);');
    }
  }

  const bodyOpts = ['sleeve: true'];
  if (claws) bodyOpts.push('claws: ' + small(quad ? 0.045 : 0.03), 'clawMat: clawM');
  if (quad) bodyOpts.push('chestDepth: 0.55', 'fingerLen: 0.07');
  if (frame.belly !== 1) bodyOpts.push('belly: ' + small(frame.belly));
  if (frame.neckR !== 1) bodyOpts.push('neckR: ' + small(frame.neckR));
  const mats = clothes
    ? '{ skin, top, bottom, shoes }'
    : '{ skin, top: skin, bottom: skin, shoes }';
  lines.push('  buildBody(rig, p, ' + mats + ', { ' + bodyOpts.join(', ') + ' });');
  lines.push('  const hl = headLift(p);');

  // ---- head, face, eyes, mouth ------------------------------------------
  // Where the eyes, brow and mouth sit on the skull, as text. The two rigs put
  // the face in different places, so each kind carries its own anchors.
  const anchor = quad
    ? { eyeY: 'hl + p.headR * 0.25', eyeZ: 'p.headR * 1.85', browY: 'hl + p.headR * 0.5', browZ: 'p.headR * 1.6', mouthY: 'hl - p.headR * 0.3', mouthZ: 'p.headR * 1.62', mouthHW: 0.52, jawY: 'hl - p.headR * 0.42' }
    : { eyeY: 'hl + 0.022', eyeZ: 'p.headR * 1.35', browY: 'hl + 0.05', browZ: 'p.headR * 1.3', mouthY: 'hl - p.headR * 0.5', mouthZ: 'p.headR * 1.02', mouthHW: 0.4, jawY: 'hl - p.headR * 0.52' };
  const eBase = quad ? [0.016, 0.013, 0.011] : [0.018, 0.014, 0.01];
  const eR = [eBase[0] * es.sx * eyeSize, eBase[1] * es.sy * eyeSize, eBase[2] * es.sz * eyeSize];
  const eGap = (quad ? 0.045 : 0.042) * eyeGap;
  const eyeMExpr = glow ? 'glowMat(' + str($('eyeglow').value) + ', { fog: false })' : 'skinMat(' + str($('eyecolor').value) + ', { rough: 0.15 })';

  if (quad) {
    lines.push('  // a low animal skull; the quad walker pitches the neck forward for you');
    lines.push('  rig.attach(rig.head, xf(ellipsoid(p.headR * ' + small(0.9 * hs.q[0]) + ', p.headR * ' + small(0.85 * hs.q[1]) + ', p.headR * ' + small(1.35 * hs.q[2]) + ', 24, 18), { y: hl, z: p.headR * 0.4 }), skin, { parent: rig.neck, axis: [0, 1, 0], len: 1, bw: 0.015 });');
    lines.push('  rig.attach(rig.head, xf(ellipsoid(p.headR * ' + small(0.62 * hs.q[0]) + ', p.headR * ' + small(0.5 * hs.q[1]) + ', p.headR * ' + small(1.1 * hs.q[2]) + ', 20, 16), { y: hl - p.headR * 0.32, z: p.headR * 1.5 }), skin, { parent: rig.neck, axis: [0, 1, 0], len: 1, bw: 0.01 });');
    lines.push('  const gum = skinMat(' + str($('skindark').value) + ", { rough: 0.35 });");
    if (jaw.len > 0) {
      lines.push('  // a lower jaw, pushed out by the jaw control');
      lines.push('  rig.attach(rig.head, xf(ellipsoid(p.headR * ' + small(0.5 + 0.35 * jaw.wide) + ', p.headR * ' + small(0.16 + 0.12 * jaw.len) + ', p.headR * ' + small(1.05 + 0.6 * jaw.len) + ', 20, 14), { y: ' + anchor.jawY + ', z: p.headR * ' + small(1.25 + 0.5 * jaw.len) + ' }), gum, { rigid: true, shadow: false });');
    }
    lines.push('  rig.attach(rig.head, xf(ellipsoid(p.headR * 0.5, p.headR * 0.1, p.headR * 1.15, 18, 12), { y: hl - p.headR * 0.42, z: p.headR * 1.15 }), gum, { rigid: true, shadow: false });');
  } else {
    lines.push('  headOn(rig, p, skin, ' + small(hs.sx) + ', ' + small(hs.sy) + ', ' + small(hs.sz) + ');');
    if (jaw.len > 0) {
      lines.push('  // a lower jaw, pushed out by the jaw control');
      lines.push('  rig.attach(rig.head, xf(ellipsoid(p.headR * ' + small(0.58 + 0.5 * jaw.wide) + ', p.headR * ' + small(0.2 + 0.14 * jaw.len) + ', p.headR * ' + small(0.78 + 0.7 * jaw.len) + ', 20, 14), { y: ' + anchor.jawY + ', z: p.headR * ' + small(0.55 + 0.6 * jaw.len) + ' }), skin, { rigid: true, shadow: false });');
    }
  }
  lines.push('  const eyeM = ' + eyeMExpr + ';');
  lines.push('  for (const s of [-1, 1]) rig.attach(rig.head, xf(ellipsoid(' + eR.map(small).join(', ') + '), { x: s * ' + small(eGap) + ', y: ' + anchor.eyeY + ', z: ' + anchor.eyeZ + ', rz: s * ' + small(eyeTilt) + ' }), eyeM, { rigid: true, shadow: false });');
  if (eyes) {
    const xr = eBase.map((v, i) => v * 0.8 * (i === 0 ? es.sx : i === 1 ? es.sy : es.sz) * eyeSize);
    lines.push('  for (let i = 0; i < ' + eyes + '; i++) rig.attach(rig.head, xf(ellipsoid(' + xr.map(small).join(', ') + '), { x: (i % 2 ? 1 : -1) * (' + small(0.05 * eyeGap) + ' + ' + small((quad ? 0.025 : 0.022) * eyeGap) + ' * Math.floor(i / 2)), y: ' + (quad ? 'hl + p.headR * 0.45' : 'hl + 0.05') + ' + 0.012 * Math.floor(i / 2), z: ' + (quad ? 'p.headR * 1.6' : 'p.headR * 1.2') + ', rz: (i % 2 ? 1 : -1) * ' + small(eyeTilt) + ' }), eyeM, { rigid: true, shadow: false });');
  }
  if (brow > 0) {
    lines.push('  // a brow ridge over the eyes');
    lines.push('  for (const s of [-1, 1]) rig.attach(rig.head, xf(ellipsoid(' + small(eGap * 1.15) + ', ' + small(0.005 + 0.012 * brow) + ', ' + small(Math.max(0.006, eR[2] * 1.9)) + '), { x: s * ' + small(eGap * 0.95) + ', y: ' + anchor.browY + ' + ' + small(0.045 * brow) + ', z: ' + anchor.browZ + ', rz: s * ' + small(eyeTilt) + ' }), skin, { rigid: true });');
  }
  if (teeth.count) {
    const hw = anchor.mouthHW * mouthW;
    const tr = teeth.r * toothSize, th = teeth.h * toothSize;
    const geo = teeth.box
      ? 'new THREE.BoxGeometry(' + small(tr * 2) + ', ' + small(th) + ', ' + small(th * 1.1) + ')'
      : 'new THREE.ConeGeometry(' + small(tr) + ', ' + small(th) + ', 5)';
    const jit = teeth.jitter ? ' + ' + small(teeth.jitter * 0.4) + ' * Math.sin(i * 12.9898)' : '';
    const rot = teeth.box ? '' : (jaw.up ? ', rx: 0' : ', rx: Math.PI');
    lines.push('  // a mouth slot and a real row of teeth:');
    lines.push('  const toothM = skinMat(' + str($('skinlight').value) + ', { rough: 0.25 });');
    if (!quad) lines.push('  rig.attach(rig.head, xf(ellipsoid(p.headR * ' + small(hw * 0.92) + ', p.headR * 0.028, p.headR * 0.07, 16, 10), { y: ' + anchor.mouthY + ', z: ' + anchor.mouthZ + ' }), skinMat(' + str($('skindark').value) + ', { rough: 0.4 }), { rigid: true, shadow: false });');
    lines.push('  for (let i = 0; i < ' + teeth.count + '; i++) {');
    lines.push('    const t = ' + (teeth.count > 1 ? '(i / ' + (teeth.count - 1) + ') * 2 - 1' : '0') + ';');
    lines.push('    rig.attach(rig.head, xf(' + geo + ', { x: t * p.headR * ' + small(hw) + jit + ', y: ' + anchor.mouthY + ' + ' + small(0.004) + ', z: ' + anchor.mouthZ + ' - ' + small(0.02 * mouthW) + ' * t * t, rz: t * 0.08' + rot + ' }), toothM, { rigid: true, shadow: false });');
    lines.push('  }');
  }
  if (horns) {
    lines.push('  // horns, curving back over the skull');
    lines.push('  for (let i = 0; i < ' + horns + '; i++) {');
    lines.push('    const sx = (i % 2 ? 1 : -1) * (0.032 + 0.022 * Math.floor(i / 2));');
    lines.push('    rig.attach(rig.head, xf(new THREE.ConeGeometry(0.02, 0.07, 7), { x: sx, y: hl + p.headR * 0.85, rz: sx * -0.35 }), hornM, { rigid: true });');
    lines.push('    rig.attach(rig.head, xf(new THREE.ConeGeometry(0.013, 0.09, 7), { x: sx * 1.6, y: hl + p.headR * 1.15, z: -p.headR * 0.2, rz: sx * -0.7 }), hornM, { rigid: true });');
    lines.push('  }');
  }

  // ---- stats ------------------------------------------------------------
  const flags = flagList();
  const defLines = [];
  defLines.push('  name: ' + str(name) + ', speed: ' + small(num('speed')) + ', chase: ' + small(num('chase')) +
    ', detect: ' + small(num('detect')) + ', dmg: ' + small(num('dmg')) + ', reach: ' + small(num('reach')) +
    ', cd: ' + small(Math.max(0.1, num('cd'))) + ', memory: ' + small(num('memory')) +
    (flags.length ? ', ' + flags.join(': true, ') + ': true,' : ','));
  defLines.push('  num: ' + str($('num').value.trim() || 'Entity 0') + ', cls: ' + str($('cls').value) +
    ', size: ' + str($('size').value.trim() || '-') + ',');
  defLines.push('  desc: ' + str($('desc').value.trim()) + ',');
  defLines.push('  notes: ' + str($('notes').value.trim()) + ',');
  defLines.push('  tips: [' + tips().map((t) => str(t)).join(', ') + '],');

  const animator = quad ? 'animateQuad' : 'animateBiped';
  const glowAnim = glow
    ? '\n      const g = 0.72 + 0.28 * Math.sin(stt.t * 2.3 + (stt.chasing ? 2 : 0));\n      setLight([eyeM], g, g, g);'
    : '';

  const out = [
    '// ' + '='.repeat(77),
    '//  ' + name + "   (entity id: '" + id + "')",
    '//',
    '//  One self-contained entity file, written with other/entity-studio.html:',
    '//    - the three.js model builder',
    '//    - its stats / field-guide entry',
    '//  Preview it live with other/entity-viewer.html (rotate, wander, sprint).',
    '//  Shared building blocks live in entities/core/.',
    '// ' + '='.repeat(77),
    '(function () {',
    "'use strict';",
    'const __mod = (window.__mod = window.__mod || {});' + (horns || teeth.count ? "\nconst THREE = __mod['vendor/three/build/three.module.js'];" : ''),
    "const { buildBody, cloth, fleshMat, headLift, " + (quad ? '' : 'headOn, ') + "HUMAN, organic, result } = __mod['src/entities/models.js'].HELPERS;",
    'const { ' + animator + ', ellipsoid, ' + (glow ? 'glowMat, ' : '') + 'Rig, ' + (glow ? 'setLight, ' : '') + 'skinMat, xf } = __mod[\'src/entities/rig.js\'];',
    "const { ENTITY_DEFS } = __mod['src/entities/registry.js'];",
    '',
    '/** ' + (quad ? 'A quadruped: ' : 'A humanoid: ') + (name) + '. ' + $('desc').value.trim().replace(/\n/g, ' ') + ' */',
    'function ' + fn + '(rng) {',
    '  const p = { ...HUMAN, ' + propText + ' };',
    '  const rig = new Rig(p);',
  ].concat(lines).concat([
    '',
    '  return result(rig, {',
    "    kind: '" + (quad ? 'quad' : 'biped') + "', height: " + small(bodyHeight) + ', radius: ' + small(0.32 * w * (quad ? 1.25 : 1)) + ', eyeY: ' + small(eyeY) + ',',
    '    animate(stt, dt) {',
    '      stt.stride = ' + small(stride) + ';' + (quad ? '\n      if (stt.pitch === undefined) stt.pitch = 1.18;' : ''),
    '      ' + animator + '(rig, stt, dt);' + glowAnim,
    '    },',
    '  });',
    '}',
    '',
    // a dashed id is not an identifier: always register through the bracket form
    "__mod['src/entities/registry.js'].BUILDERS['" + id + "'] = " + fn + ';',
    '',
    "ENTITY_DEFS['" + id + "'] = {",
    defLines.join('\n'),
    '};',
    '})();',
    '',
  ]);
  // the studio's own state rides along as a final comment so File > Open .js can restore it
  out.push('/* studio-state ' + stateJSON().replace(/\*\//g, '*\\/') + ' */', '');

  return { text: out.join('\n'), id, name, fname };
}

// ------------------------------------------------------------------ checks + output
function problems(built) {
  const out = [];
  if (GAME.entities.includes(built.id)) out.push('There is already a creature with the id "' + built.id + '" - pick another id.');
  if (!/^[a-z0-9][a-z0-9_-]*$/.test(built.id)) out.push('The id should be letters, numbers, dashes or underscores only.');
  if (built.id.length < 3) out.push('The id is very short; you will have trouble finding it later.');
  if (num('chase') > 0 && num('detect') <= 0) out.push('It chases but cannot see anything: raise "sees you at".');
  if (num('chase') > 0 && num('dmg') <= 0) out.push('It chases but does no damage: give it damage or set the chase speed to 0.');
  if ($('flag_passive').checked && num('chase') > 0) out.push('passive + a chase speed contradict each other: pick one.');
  if ($('flag_watcher').checked && num('chase') > 0) out.push('watcher + a chase speed contradict each other: pick one.');
  if (num('speed') === 0 && num('chase') === 0) out.push('It never moves. Fine for a statue or a watcher.');
  if (num('height') > 3.4) out.push('Over 3.4 m it will not fit through most doorways.');
  if ($('kind').value !== 'quad' && num('eyegap') > 1.9) out.push('Eyes set that far apart end up on the sides of the head - fine if that is the look you want.');
  if (num('neck') > 1.6) out.push('A neck that long means the head sticks up above the shoulders; check the preview.');
  if ($('teeth').value !== 'none' && num('chase') === 0 && num('dmg') === 0) out.push('It has teeth but does no damage and never chases: the teeth are decoration.');
  if (!tips().length) out.push('No tips: the field guide entry will be short.');
  return out;
}

// ------------------------------------------------------------------ the property schema
// Every control in the properties editor, with the ids the file builder reads.
const OPT = (a) => a.map((x) => [x[0], x[1]]);
const TABS = [
  { id: 'body', icon: 'body', label: 'Body', sub: 'Skeleton and proportions', groups: [

const FIELD_IDS = [];
for (const t of TABS) for (const g of t.groups) { if (g.f) for (const f of g.f) FIELD_IDS.push(f.id); }
for (const [id] of FLAGS) FIELD_IDS.push('flag_' + id);
FIELD_IDS.push('filename');

function getValues() {
  const v = {};
  for (const id of FIELD_IDS) { const el = $(id); if (el) v[id] = el.type === 'checkbox' ? !!el.checked : el.value; }
  return v;
}
function syncField(el) {
  if (!el || !el.id) return;
  const id = el.id;
  if (el.type === 'range') {
    const min = parseFloat(el.min), max = parseFloat(el.max), v = parseFloat(el.value);
    const f = $('f_' + id), val = $('v_' + id);
    if (f) f.style.width = (clampRange((v - min) / ((max - min) || 1), 0, 1) * 100) + '%';
    const meta = findField(id);
    if (val) val.textContent = (FMT[meta && meta.fmt] || FMT.p2)(v);
  } else if (el.type === 'color') {
    const h = $('h_' + id); if (h) h.textContent = el.value;
  }
}
function syncAll() { for (const id of [...FIELD_IDS, ...BRUSH_FIELDS.map((f) => f.id), 'animspeed']) syncField($(id)); }
const _fieldIndex = {};
function findField(id) {
  if (_fieldIndex[id]) return _fieldIndex[id];
  for (const t of TABS) for (const g of t.groups) if (g.f) for (const f of g.f) if (f.id === id) return (_fieldIndex[id] = f);
  for (const f of [...BRUSH_FIELDS, SPEED_FIELD]) if (f.id === id) return (_fieldIndex[id] = f);
  return null;
}
function setValues(v) {
  for (const id of Object.keys(v)) {
    const el = $(id); if (!el) continue;
    if (el.type === 'checkbox') el.checked = !!v[id]; else el.value = v[id];
  }
  syncAll();
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage full or blocked */ } }
let toastT = 0;
function toast(msg) {
  const t = $('vtoast'); if (!t) return;
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800);
}

const VERSION = 2;
function stateObject() {
  return { app: 'entity-studio', ver: VERSION, seed, v: getValues(), p: painting.map((s) => ({ role: s.role, tool: s.tool || 'brush', dabs: s.dabs })) };
}
function stateJSON() { return JSON.stringify(stateObject()); }
let paintRev = 0, _pj = null, _pjRev = -1;
function paintJSON() { if (_pjRev !== paintRev) { _pj = JSON.stringify(painting); _pjRev = paintRev; } return _pj; }

const hist = { stack: [], i: -1 };
function sameValues(a, b) { for (const k of Object.keys(a)) if (a[k] !== b[k]) return false; return true; }
function snapshot() {
  const s = { v: getValues(), p: paintJSON(), seed };
  const last = hist.stack[hist.i];
  if (last && last.p === s.p && sameValues(last.v, s.v)) return;
  hist.stack.length = hist.i + 1;
  hist.stack.push(s);
  if (hist.stack.length > 120) hist.stack.shift();
  hist.i = hist.stack.length - 1;
  lsSet('lb.es.autosave', stateJSON());
  renderHistory();
}
function restore(s) {
  setValues(s.v);
  painting = JSON.parse(s.p); stroke = null; paintRev++;
  seed = s.seed || seed;
  update(false);
}
function undo() { if (hist.i > 0) { hist.i--; restore(hist.stack[hist.i]); toast('Undo'); } else toast('Nothing to undo'); renderHistory(); }
function redo() { if (hist.i < hist.stack.length - 1) { hist.i++; restore(hist.stack[hist.i]); toast('Redo'); } else toast('Nothing to redo'); renderHistory(); }
function renderHistory() { const e = $('sthist'); if (e) e.textContent = 'history ' + (hist.i + 1) + '/' + hist.stack.length; }

function applyState(obj) {
  if (!obj || obj.app !== 'entity-studio') throw new Error('not a studio state');
  setValues(obj.v || {});
  painting = (obj.p || []).map((s) => ({ role: s.role, tool: s.tool || 'brush', dabs: s.dabs || [] }));
  stroke = null; paintRev++;
  seed = obj.seed || 1;
  $('filename').dataset.touched = '1';
  needFrame = true;
  update(false);
  snapshot();
}

function initPreview() {
  const canvas = $('c');

function drawGizmo() {

  const axes = [
    ['x', new THREE.Vector3(1, 0, 0), '#e8524a', 'left'], ['-x', new THREE.Vector3(-1, 0, 0), '#e8524a', 'right'],
    ['y', new THREE.Vector3(0, 1, 0), '#7fd34a', 'top'], ['-y', new THREE.Vector3(0, -1, 0), '#7fd34a', 'bottom'],
    ['z', new THREE.Vector3(0, 0, 1), '#4a8ee8', 'front'], ['-z', new THREE.Vector3(0, 0, -1), '#4a8ee8', 'back'],
  ].map(([n, v, col, view]) => { const p = v.clone().applyQuaternion(inv); return { n, col, view, x: C + p.x * R, y: C - p.y * R, z: p.z }; });

// ------------------------------------------------------------------ rebuild + frame loop
function rebuild(reseed) {
  if (!renderer) return;
  const built = buildFile();
  let ok = true;
  try {
    new Function(built.text)();
  } catch (e) {
    ok = false;
    $('problems').innerHTML = '<p class="warn">The generated file threw an error: ' + esc(e && e.message) + '</p>';
  }
  if (!ok || !M['src/entities/registry.js'].BUILDERS[built.id]) return;
  disposeCurrent();
  // Textures are cached by name for the whole page, so drop them: without this a
  // skin-colour change would never show up, and the brush strokes the file replays
  // would be laid on top of the ones already in the canvas.
  clearTextures();
  if (reseed) seed += 1;
  let model;
  try {
    model = M['src/entities/models.js'].buildModel(built.id, new RNG(seed * 7919 + 13));
  } catch (e) {
    $('problems').innerHTML = '<p class="warn">The model could not be built: ' + esc(e && e.message) + '</p>';
    return;
  }
  model.root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = false; o.frustumCulled = false; } });
  const holder = new THREE.Group();
  holder.add(model.root);
  scene.add(holder);
  current = {
    id: built.id, model, holder,
    st: { speed: 0, phase: Math.random() * 6, t: Math.random() * 10, look: 0, attack: 0, chasing: false,
      crawl: false, ceiling: 3.2, prox: 0, stride: num('stride'), pitch: $('kind').value === 'quad' ? 1.18 : 0 },
  };
  for (let i = 0; i < 8; i++) { try { model.animate(current.st, 0.016); } catch (e) { break; } }
  setLight(model.mats, 0.34, 0.34, 0.34);
  const h = model.height || 1.8;
  if (needFrame || !lastFrameH || Math.abs(h - lastFrameH) / lastFrameH > 0.18) { frameView(); cam.dist = cam.want; needFrame = false; }
  applyShading();
  buildRuler();
  refreshHighlight();

}

let last = performance.now(), fpsT = 0, frames = 0;

    renderer.setSize(w, h, false);
    persp.aspect = w / Math.max(1, h);
    persp.updateProjectionMatrix();
  }
  GLOBAL_UNIFORMS.uTime.value += dt;
  if (current) {
    const pose = $('pose').value;
    const walk = Math.max(num('speed'), 0.6), run = Math.max(num('chase'), walk * 1.6);
    const target = pose === 'idle' ? 0 : pose === 'chase' ? run : walk;
    const play = VS.play ? 1 : 0;
    const sp = parseFloat($('animspeed').value);
    current.st.speed += (target - current.st.speed) * Math.min(1, dt * 4) * play;
    current.st.chasing = pose === 'chase';
    current.st.stride = num('stride');
    try {
      current.model.animate(current.st, play ? dt * (isNaN(sp) ? 1 : sp) : 0.00001);

    $('readout').textContent = (frames / fpsT).toFixed(0) + ' fps' + (current ? ' · ' + current.st.speed.toFixed(2) + ' m/s' : '') + (tris ? ' · ' + (tris / 1000).toFixed(1) + 'k tris' : '');

let selNode = 'root';
function regionBox(kind) {

  if (full.isEmpty()) return null;
  if (kind === 'body' || kind === 'root') return full;
  const hgt = full.max.y - full.min.y;

    const ey = current.model.eyeY || full.max.y * 0.9;
    b.min.y = ey - hgt * 0.17; b.max.y = Math.min(full.max.y + 0.02, ey + hgt * 0.15);
    const half = hgt * 0.17;               // a head is not as wide as the whole creature
    b.min.x = Math.max(full.min.x, -half); b.max.x = Math.min(full.max.x, half);

  if (was) return;
  btn.classList.add('open');
  const dd = document.createElement('div');
  dd.className = 'dd';
  const bar = $('menubar').getBoundingClientRect(), br = btn.getBoundingClientRect();
  dd.style.left = Math.max(0, br.left - bar.left) + 'px';
  for (const it of menuDefs()[i].items) {
    if (it.sep) { const s = document.createElement('div'); s.className = 'sep'; dd.appendChild(s); continue; }
    const r = document.createElement('div');
    r.className = 'it';
    r.innerHTML = '<span class="ck">' + (it.check && it.check() ? '✓' : '') + '</span><span>' + esc(it.l) + '</span><span class="k">' + esc(it.k || '') + '</span>';
    r.addEventListener('click', (e) => { e.stopPropagation(); closeAll(); it.fn(); });
    dd.appendChild(r);
  }
  $('menubar').appendChild(dd);
}

function showModal(html) { $('modalcard').innerHTML = html; $('modal').classList.add('on'); }
function hideModal() { $('modal').classList.remove('on'); }
function showHelp() {
  const rows = [['V / B / A / E / I / U', 'Orbit-select, Brush, Spray (airbrush), Eraser, Eyedropper, Fill'], ['[  ]', 'Brush smaller / bigger'], ['Drag', 'Orbit (miss the model with a paint tool and it orbits too)'], ['Shift+drag / middle', 'Pan'], ['Ctrl+drag / wheel', 'Zoom'], ['Right button', 'Always orbits, even while painting'],
    ['F  /  double-click', 'Frame the creature'], ['1  3  7  Ctrl+1  Ctrl+3', 'Front, left, top, back, right'], ['5', 'Perspective / orthographic'], ['Z', 'Cycle shading: material, clay, wire'], ['G  T', 'Toggle grid / turntable'], ['Space', 'Play / pause the animation'], ['R', 'New random bits (another individual of the same species)'],
    ['Ctrl+Z / Ctrl+Y', 'Undo / redo - sliders and paint alike'], ['Ctrl+S / Ctrl+O', 'Download .js / open a studio-written .js'], ['Double-click a slider', 'Type an exact value'], ['?', 'This list']];
  showModal('<h3>Keyboard and mouse</h3><table>' + rows.map((r) => '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>').join('') + '</table><div class="btnrow"><button type="button" class="btn pri" id="modalok">Close</button></div>');
  $('modalok').addEventListener('click', hideModal);
}
function showAbout() {
  showModal('<h3>Labyrinth Box - Entity Studio</h3><p class="note">Builds a creature out of the same rig, skin and cloth generators the game uses and writes one self-contained <code>entities/&lt;id&gt;.js</code> file. ' +
    'The viewport is live: every control rebuilds the model, and the paint tools write into the real textures.</p><p class="note">The file ends with a comment holding the studio\'s state, so File &gt; Open .js continues exactly where you stopped. Your last session is also kept in this browser.</p>' +
    '<div class="btnrow"><button type="button" class="btn pri" id="modalok">Close</button></div>');
  $('modalok').addEventListener('click', hideModal);
}

// ------------------------------------------------------------------ actions
function downloadFile() {
  const built = buildFile();
  const blob = new Blob([built.text], { type: 'text/javascript' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = built.fname;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Saved ' + built.fname);
}
function copyFile() { navigator.clipboard.writeText($('file').textContent); toast('File copied'); flashButton('copy', 'Copied', 'Copy the file'); }
function clearPaint() { painting = []; stroke = null; paintRev++; update(false); snapshot(); renderPaintInfo(); toast('Paint cleared'); }
function newCreature() {
  applyPreset(PRESETS[1]);
  hist.stack = []; hist.i = -1; snapshot();
  toast('New creature');
}
function openFileText(text) {
  const m = /\/\* studio-state ([\s\S]*) \*\/\s*$/.exec(text);
  if (!m) { toast('That file has no studio state - only files written by this studio can be reopened'); return; }
  try { applyState(JSON.parse(m[1].replace(/\*\\\//g, '*/'))); toast('Opened'); } catch (e) { toast('Could not read the studio state: ' + e.message); }
}

// ------------------------------------------------------------------ keyboard
function onKey(e) {
  const t = e.target;
  const typing = t && (t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || (t.tagName === 'INPUT' && !/^(range|checkbox|color|button|hidden)$/.test(t.type || '')));
  const k = (e.key || '').toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (k === 'escape') { closeAll(); hideModal(); return; }
  if (mod && k === 'z') { if (typing && t.tagName === 'TEXTAREA') return; e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 's') { e.preventDefault(); downloadFile(); return; }
  if (mod && k === 'o') { e.preventDefault(); $('openfile').click(); return; }
  if (typing || e.altKey) return;
  const map = { v: 'select', b: 'brush', a: 'spray', e: 'erase', i: 'pick', u: 'fill' };
  if (!mod && map[k]) { setTool(map[k]); return; }
  switch (k) {
    case 'f': case 'home': frameView(); break;
    case 'g': toggleOver('grid'); break;
    case 't': toggleOver('turn'); break;
    case 'z': if (!mod) cycleShading(); break;
    case ' ': e.preventDefault(); setPlay(!VS.play); break;
    case 'r': update(true); snapshot(); break;
    case '1': setView(mod ? 'back' : 'front'); e.preventDefault(); break;
    case '3': setView(mod ? 'right' : 'left'); e.preventDefault(); break;
    case '7': setView('top'); break;
    case '5': setOrtho(!VS.ortho); break;
    case '[': case ']': {
      const el = $('brushsize'); const f = k === ']' ? 1.25 : 0.8;
      el.value = clampRange(parseFloat(el.value) * f, parseFloat(el.min), parseFloat(el.max)); syncField(el); break;
    }
    case '?': showHelp(); break;
  }
}

// ------------------------------------------------------------------ presets + the file
const presetBox = $('presets');
PRESETS.forEach((p) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = p.name;
  b.title = p.desc || p.name;
  b.addEventListener('click', () => applyPreset(p));
  presetBox.appendChild(b);
});
function applyPreset(p) {
  const map = { name2: 'name' };
  // the detail controls are per-creature too: reset them first so a preset that
  // says nothing about the face gets a neutral one instead of the last one's teeth.
  for (const k of Object.keys(DETAIL_DEFAULTS)) {
    const el = $(k);
    if (!el) continue;
    if (el.type === 'checkbox') el.checked = !!DETAIL_DEFAULTS[k]; else el.value = DETAIL_DEFAULTS[k];
  }
  for (const k of Object.keys(p)) {
    if (k === 'flags' || k === 'name') continue;
    const el = $(map[k] || k);
    if (!el) continue;
    if (el.type === 'checkbox') el.checked = !!p[k];
    else el.value = p[k];
  }
  for (const [id] of FLAGS) $('flag_' + id).checked = (p.flags || []).includes(id);
  $('filename').value = p.id;
  $('filename').dataset.touched = '1';
  // a preset is a different creature wearing different textures, so its paint goes too
  painting = [];
  stroke = null; paintRev++;
  renderPaintInfo();
  syncAll();
  needFrame = true;
  update(false, true);
  if (renderer) rebuild(false);
  snapshot();
}

let updT = 0, snapT = 0;
function scheduleUpdate(immediate) {
  clearTimeout(updT); clearTimeout(snapT);
  updT = setTimeout(() => update(false), immediate ? 0 : 200);
  snapT = setTimeout(snapshot, immediate ? 60 : 700);
}

function update(reseed, quiet) {
  const built = buildFile();
  $('file').textContent = built.text;
  $('path1').textContent = 'entities/' + built.fname;
  $('line1').textContent = "    '" + built.fname + "',";
  $('idline').textContent = '    "' + built.id + '",';
  const probs = problems(built);
  $('problems').innerHTML = probs.length
    ? '<p class="warn">' + probs.length + ' thing(s) to check:</p><ul class="plist warn">' + probs.map((p) => '<li>' + esc(p) + '</li>').join('') + '</ul>'
    : '<p class="ok">Nothing in the way of saving it.</p>';
  const chip = $('chip');
  chip.textContent = probs.length ? probs.length + ' to check' : 'ready to save';
  chip.className = 'chip ' + (probs.length ? 'bad' : 'good');
  $('vinfo').textContent = built.name + '  ·  entities/' + built.fname + '  ·  ' + ($('kind').value === 'quad' ? 'quadruped' : 'biped') + ' ' + num('height').toFixed(2) + ' m';
  if (!quiet) rebuild(reseed);
  renderOutliner();
  renderPaintInfo();
}

// ------------------------------------------------------------------ wiring
function wire() {
  // one delegated listener per event type: every control sits under the document
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (!t || !t.id) return;
    syncField(t);
    if (/^brush/.test(t.id)) { if (t.id === 'brushcolor') pushRecent(t.value); saveBrush(); return; }
    if (t.id === 'animspeed') return;
    if (t.id === 'id' && !$('filename').dataset.touched) $('filename').value = ($('id').value.trim() || 'my-entity');
    if (t.id === 'filename') $('filename').dataset.touched = '1';
    scheduleUpdate();
  });
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (!t) return;
    if (!(t.closest && t.closest('.dd'))) closeAll();
    const up = (sel) => (t.closest ? t.closest(sel) : null);
    let el;
    if ((el = up('.tab'))) return showTab(el.dataset.tab);
    if ((el = up('[data-fold]'))) { el.classList.toggle('shut'); const b = el.nextElementSibling; if (b) b.classList.toggle('shut'); return; }
    if ((el = up('[data-eye]'))) { e.stopPropagation(); return toggleEye(el.dataset.eye); }
    if ((el = up('[data-node]'))) return selectNode(el.dataset.node);
    if ((el = up('[data-shade]'))) return setShading(el.dataset.shade);
    if ((el = up('[data-over]'))) return toggleOver(el.dataset.over);
    if ((el = up('[data-cam]'))) {
      const c = el.dataset.cam;
      if (c === 'persp') setOrtho(false); else if (c === 'ortho') setOrtho(true); else if (c === 'frame') frameView(); else if (c === 'shot') screenshot();
      return;
    }
    if ((el = up('[data-pose]'))) return setPose(el.dataset.pose);
    if ((el = up('#palette i, #recent i'))) return setBrushColour(el.dataset.c);
    if ((el = up('[data-clear]'))) {
      painting = painting.filter((s) => s.role !== el.dataset.clear); stroke = null; paintRev++; update(false); snapshot(); return;
    }
    if ((el = up('.panelhead')) && el.dataset.fold) { el.classList.toggle('shut'); const b = $(el.dataset.fold); if (b) b.classList.toggle('shut'); }
  });
  document.addEventListener('dblclick', (e) => {
    const s = e.target && e.target.closest ? e.target.closest('.fld.slider') : null;
    if (!s) return;
    const r = s.querySelector('input[type=range]');
    const box = document.createElement('input');
    box.type = 'text'; box.className = 'edit'; box.value = r.value;
    s.appendChild(box); box.focus(); box.select && box.select();
    let closed = false;
    const done = (ok) => {
      if (closed) return;
      closed = true;
      if (ok) {
        const v = parseFloat(box.value);
        if (!isNaN(v)) { r.value = clampRange(v, parseFloat(r.min), parseFloat(r.max)); r.dispatchEvent(new Event('input', { bubbles: true })); }
      }
      box.remove();
    };
    box.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') done(true); else if (ev.key === 'Escape') done(false); ev.stopPropagation(); });
    box.addEventListener('blur', () => done(true));
  });
  document.addEventListener('mouseover', (e) => {
    let t = e.target;
    while (t && !(t.dataset && t.dataset.tip)) t = t.parentNode;
    const tip = $('tip');
    if (tip) tip.textContent = t ? t.dataset.tip : 'Hover a control for a hint. Press ? for the shortcut list.';
  });
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', closeAll);

  $('dl').addEventListener('click', downloadFile);
  $('dl2').addEventListener('click', downloadFile);
  $('copy').addEventListener('click', copyFile);
  $('copyline').addEventListener('click', () => { navigator.clipboard.writeText($('line1').textContent); flashButton('copyline', 'Copied', 'Copy the loader line'); });
  $('copyid').addEventListener('click', () => { navigator.clipboard.writeText($('idline').textContent); flashButton('copyid', 'Copied', 'Copy the id line'); });
  $('openbtn').addEventListener('click', () => $('openfile').click());
  $('openfile').addEventListener('change', () => {
    const f = $('openfile').files && $('openfile').files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => openFileText(String(rd.result));
    rd.readAsText(f);
    $('openfile').value = '';
  });
  $('reseed').addEventListener('click', () => { update(true); snapshot(); });
  $('rebuild').addEventListener('click', () => update(false));
  $('playbtn').addEventListener('click', () => setPlay(!VS.play));
  $('chip').addEventListener('click', () => showTab('export'));
  $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) hideModal(); });
  $('paintundo').addEventListener('click', () => {
    if (!painting.length) return;
    painting.pop(); stroke = null; paintRev++; update(false); snapshot();
  });
  $('paintclear').addEventListener('click', clearPaint);
  $('lightsel').addEventListener('change', () => setLighting($('lightsel').value));
  $('bgsel').addEventListener('change', () => setBackground($('bgsel').value));
}
function saveBrush() {
  lsSet('lb.es.brush', JSON.stringify(Object.fromEntries(BRUSH_FIELDS.map((f) => [f.id, $(f.id).value]))));
}
function loadBrush() {
  try {
    const b = JSON.parse(lsGet('lb.es.brush') || '{}');
    for (const f of BRUSH_FIELDS) if (b[f.id] !== undefined && $(f.id)) $(f.id).value = b[f.id];
  } catch (e) { /* defaults */ }
}

// A creature file that loaded but is missing from the studios' pick list can never
// be spawned by a level. This catches a file saved without finishing the steps.
function wiringProblems() {
  const picked = new Set(GAME.entities);
  return Object.keys(ED).filter((id) => !ED[id].phobia && !picked.has(id));
}
function renderWiring() {
  const missing = wiringProblems();
  const box = $('wire');
  if (!missing.length) {
    box.innerHTML = '<p class="ok">Every creature that just loaded is in the pick lists too - the game, the entity viewer, the level studio and the field guide all see them.</p>';
    return;
  }
  box.innerHTML = '<p class="warn">' + missing.length + ' loaded creature(s) are missing from the studio pick lists, so a level cannot spawn them: <code>' + missing.join(', ') + '</code></p>' +
    '<p class="note">Add each id to the <code>"entities"</code> array of <code>GAME</code> in other/level-studio.html and other/entity-studio.html.</p>';
}

// ------------------------------------------------------------------ start
buildToolbox();
buildOptbar();
buildProps();
buildTimeline();
buildViewHeader();
buildMenus();
loadBrush();
initPreview();
wire();
setTool('select');
showTab('body');
setPose('walk', true);
setPlay(true);
syncAll();
renderWiring();
renderRecent();
renderHistory();
(function start() {
  let restored = false;
  const saved = lsGet('lb.es.autosave');
  if (saved) {
    try { applyState(JSON.parse(saved)); restored = true; toast('Restored your last session'); } catch (e) { restored = false; }
  }
  if (!restored) applyPreset(PRESETS[1]);
  if (!hist.stack.length) snapshot();
})();
requestAnimationFrame(loop);
</script>
